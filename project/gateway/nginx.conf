# EduGen gateway (course chapter 7.6): the single entry point of the browser.
# - routes by path to the Lab and the Review service and serves the client application
# - the Generator, the Evaluator and /internal/ endpoints are not reachable from outside
# - limits login and join attempts per client address (429 when exceeded)
# - streams Server-Sent Events without buffering
# Authentication and record-level authorization stay in the services that own the data.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

upstream lab_service { server lab:8000; }
upstream review_service { server review:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/lab/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://lab_service/auth/login;
    }

    location = /api/review/v1/sessions {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://review_service/v1/sessions;
    }

    # Server-Sent Events: one long response per client, forwarded event by event
    location /api/lab/events/stream {
        proxy_pass http://lab_service/events/stream;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The trailing slash strips the prefix: /api/lab/experiments reaches the Lab as /experiments
    location /api/lab/ {
        proxy_pass http://lab_service/;
    }

    location /api/review/internal/ {
        return 404;
    }

    location /api/review/ {
        proxy_pass http://review_service/;
    }

    # Single-page application: unknown paths load index.html and the client router takes over
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
