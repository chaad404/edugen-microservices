# Model registry. An alias is never re-pointed to a different model (thesis rule): if a model must change,
# add a new alias. The four thesis models are pinned to one host each, so every request runs on the same
# backend and precision. The route to that host may change (each job records the provider it used).
# Prices are list prices per million tokens (estimates, not invoices). output_tokens_per_question is what the
# model wrote per question in the 23 October run (all strategies; gpt-oss includes its reasoning tokens); the
# Lab uses it for the expected cost of a run.
pricing_version: "2026-10-19"

# The thesis protocol's fixed sampling settings, sent unchanged to every real model so that differences come
# from the models and not from each provider's own defaults (jobs before 2026-10-29 used those defaults).
# max_tokens leaves room for gpt-oss's reasoning tokens. Each job records the settings it was run with.
defaults: {temperature: 0.7, top_p: 1.0, max_tokens: 8192}

models:
  simulator:
    label: Offline simulator
    provider: simulator
    model_id: edugen-simulator-1
    rpm: 600
    price_per_m: {input: 0, output: 0}
    notes: Builds synthetic cloze questions from the topic text. For demos and tests; not a language model.

  gpt-oss:
    label: gpt-oss-120b
    provider: openrouter
    model_id: openai/gpt-oss-120b
    api_key_env: OPENROUTER_API_KEY
    params: 117B total / 5.1B active (MoE)
    output_tokens_per_question: 326
    routing: {order: [groq], allow_fallbacks: false, require_parameters: true}
    extra: {reasoning: {effort: medium}}   # as in the thesis protocol
    rpm: 30
    price_per_m: {input: 0.15, output: 0.60}

  llama33:
    label: Llama 3.3 70B
    provider: openrouter
    model_id: meta-llama/llama-3.3-70b-instruct
    api_key_env: OPENROUTER_API_KEY
    params: 70B dense
    output_tokens_per_question: 96
    routing: {order: [coreweave], quantizations: [fp16], allow_fallbacks: false, require_parameters: true}
    rpm: 30
    price_per_m: {input: 0.71, output: 0.71}

  # Same model on the same host as before; since 2026-10-29 it is called through Mistral's own API instead of
  # OpenRouter, whose shared Mistral pool answered HTTP 429 (5 of the 9 Mistral jobs of the 23 October run
  # failed on it).
  mistral-small:
    label: Mistral Small 4
    provider: mistral
    model_id: mistral-small-2603
    api_key_env: MISTRAL_API_KEY
    params: 119B total / 6.5B active (MoE)
    output_tokens_per_question: 132
    rpm: 6      # the account allows 100 requests and 100k tokens a minute; a call can use ~15k tokens
    price_per_m: {input: 0.15, output: 0.60}

  cohere:
    label: Command A
    provider: cohere
    model_id: command-a-03-2025
    api_key_env: COHERE_API_KEY
    params: 111B dense
    output_tokens_per_question: 118
    rpm: 18
    price_per_m: {input: 2.50, output: 10.00}
