# Model registry. An alias is never re-pointed to a different model (thesis rule): if a model must change,
# add a new alias. The four thesis models are pinned to one host each, so every request runs on the same
# backend and precision. Prices are list prices per million tokens (estimates, not invoices).
pricing_version: "2026-10-19"

models:
  simulator:
    label: Offline simulator
    provider: simulator
    model_id: edugen-simulator-1
    rpm: 600
    price_per_m: {input: 0, output: 0}
    notes: Builds synthetic cloze questions from the topic text. For demos and tests; not a language model.

  gpt-oss:
    label: gpt-oss-120b
    provider: openrouter
    model_id: openai/gpt-oss-120b
    api_key_env: OPENROUTER_API_KEY
    params: 117B total / 5.1B active (MoE)
    routing: {order: [groq], allow_fallbacks: false, require_parameters: true}
    rpm: 30
    price_per_m: {input: 0.15, output: 0.60}

  llama33:
    label: Llama 3.3 70B
    provider: openrouter
    model_id: meta-llama/llama-3.3-70b-instruct
    api_key_env: OPENROUTER_API_KEY
    params: 70B dense
    routing: {order: [coreweave], quantizations: [fp16], allow_fallbacks: false, require_parameters: true}
    rpm: 30
    price_per_m: {input: 0.71, output: 0.71}

  mistral-small:
    label: Mistral Small 4
    provider: openrouter
    model_id: mistralai/mistral-small-2603
    api_key_env: OPENROUTER_API_KEY
    params: 119B total / 6.5B active (MoE)
    routing: {order: [mistral], allow_fallbacks: false, require_parameters: true}
    rpm: 20
    price_per_m: {input: 0.15, output: 0.60}

  cohere:
    label: Command A
    provider: cohere
    model_id: command-a-03-2025
    api_key_env: COHERE_API_KEY
    params: 111B dense
    rpm: 18
    price_per_m: {input: 2.50, output: 10.00}
